<div class="doc-content">
    <h1>🧪 实验性 · Minecraft 皮肤查看器</h1>
    <p style="color:var(--text-secondary);">基于 skinview3d 的 3D 皮肤展示 · 输入玩家名称或皮肤图片 URL</p>

    <div style="display:flex;flex-wrap:wrap;gap:1.5rem;margin:1.5rem 0;">
        <!-- 左侧：控制区 -->
        <div style="flex:1;min-width:200px;background:rgba(255,255,255,0.03);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border-color);">
            <h3 style="margin-bottom:0.5rem;">🎮 控制面板</h3>
            
            <div style="margin-bottom:1rem;">
                <label style="display:block;color:var(--text-secondary);font-size:0.9rem;margin-bottom:0.3rem;">玩家名称</label>
                <input type="text" id="usernameInput" value="Notch" placeholder="输入玩家名称..." style="width:100%;padding:0.5rem;border-radius:6px;border:1px solid var(--border-color);background:rgba(255,255,255,0.05);color:var(--text-primary);font-family:var(--font-pixel);font-size:0.9rem;outline:none;">
                <button id="loadSkinBtn" style="margin-top:0.5rem;padding:0.4rem 1rem;border-radius:6px;border:none;background:var(--accent);color:#fff;font-family:var(--font-pixel);cursor:pointer;">加载皮肤</button>
            </div>

            <div style="border-top:1px solid var(--border-color);padding-top:1rem;margin-bottom:1rem;">
                <p style="color:var(--text-muted);font-size:0.8rem;">或直接输入皮肤图片 URL：</p>
                <input type="text" id="skinUrlInput" placeholder="https://example.com/skin.png" style="width:100%;padding:0.5rem;border-radius:6px;border:1px solid var(--border-color);background:rgba(255,255,255,0.05);color:var(--text-primary);font-size:0.85rem;outline:none;">
                <button id="loadCustomBtn" style="margin-top:0.5rem;padding:0.4rem 1rem;border-radius:6px;border:none;background:var(--accent);color:#fff;font-family:var(--font-pixel);cursor:pointer;">加载自定义</button>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;border-top:1px solid var(--border-color);padding-top:1rem;">
                <button id="autoRotateBtn" style="padding:0.3rem 0.8rem;border-radius:6px;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);font-family:var(--font-pixel);cursor:pointer;font-size:0.8rem;">⏸ 暂停旋转</button>
                <button id="walkingBtn" style="padding:0.3rem 0.8rem;border-radius:6px;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);font-family:var(--font-pixel);cursor:pointer;font-size:0.8rem;">🚶 行走动画</button>
                <button id="resetBtn" style="padding:0.3rem 0.8rem;border-radius:6px;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);font-family:var(--font-pixel);cursor:pointer;font-size:0.8rem;">↺ 重置视角</button>
            </div>

            <div style="border-top:1px solid var(--border-color);padding-top:1rem;margin-top:1rem;">
                <p style="color:var(--text-muted);font-size:0.8rem;">💡 提示：鼠标拖拽旋转 · 滚轮缩放</p>
            </div>
        </div>

        <!-- 右侧：皮肤展示 -->
        <div style="flex:2;min-width:280px;background:rgba(255,255,255,0.02);border-radius:var(--radius);border:1px solid var(--border-color);display:flex;justify-content:center;align-items:center;min-height:400px;position:relative;">
            <canvas id="skinCanvas" style="display:block;width:100%;height:100%;max-height:500px;image-rendering:pixelated;"></canvas>
            <div id="loadingText" style="position:absolute;color:var(--text-muted);font-size:0.9rem;pointer-events:none;">加载中...</div>
        </div>
    </div>

    <div class="footnote">
        <p>实验性功能 · 方块狂想曲 Wiki</p>
    </div>
</div>

<!-- ===== 使用多个 CDN 源尝试加载 skinview3d ===== -->
<script>
    // 尝试加载 skinview3d，使用多个备用 CDN
    (function loadSkinView3D() {
        var loadingText = document.getElementById('loadingText');
        if (!loadingText) return;

        var cdnUrls = [
            'https://cdnjs.cloudflare.com/ajax/libs/skinview3d/3.1.0/skinview3d.bundle.min.js',
            'https://cdn.jsdelivr.net/npm/skinview3d@3.0.0/dist/skinview3d.bundle.js',
            'https://unpkg.com/skinview3d@3.0.0/dist/skinview3d.bundle.js'
        ];

        var currentIndex = 0;

        function tryLoadNext() {
            if (currentIndex >= cdnUrls.length) {
                var localScript = document.createElement('script');
                localScript.src = '/icon/skinview3d.bundle.js';
                localScript.onload = function() {
                    console.log('✅ skinview3d 从本地加载成功');
                    if (typeof skinview3d !== 'undefined') {
                        loadingText.textContent = '✅ 加载完成';
                        loadingText.style.color = 'var(--text-muted)';
                        setTimeout(function() { 
                            loadingText.style.display = 'none'; 
                            initSkinViewer();
                        }, 300);
                    } else {
                        showError('所有加载方式均失败，请刷新后重试');
                    }
                };
                localScript.onerror = function() {
                    showError('所有加载方式均失败，请刷新后重试');
                };
                document.head.appendChild(localScript);
                return;
            }

            var url = cdnUrls[currentIndex];
            console.log('尝试从 CDN 加载 skinview3d:', url);

            var script = document.createElement('script');
            script.src = url;
            script.onload = function() {
                if (typeof skinview3d !== 'undefined') {
                    console.log('✅ skinview3d 从 CDN 加载成功:', url);
                    loadingText.textContent = '✅ 加载完成';
                    loadingText.style.color = 'var(--text-muted)';
                    setTimeout(function() { 
                        loadingText.style.display = 'none'; 
                        initSkinViewer();
                    }, 300);
                } else {
                    currentIndex++;
                    tryLoadNext();
                }
            };
            script.onerror = function() {
                currentIndex++;
                tryLoadNext();
            };
            document.head.appendChild(script);
        }

        function showError(msg) {
            loadingText.textContent = '❌ ' + msg;
            loadingText.style.color = '#ff6b6b';
            console.error('skinview3d 加载失败');
        }

        if (typeof skinview3d !== 'undefined') {
            console.log('✅ skinview3d 已存在');
            loadingText.style.display = 'none';
            setTimeout(initSkinViewer, 100);
            return;
        }

        tryLoadNext();
    })();

    // ============================================================
    // 初始化皮肤查看器
    // ============================================================
    function initSkinViewer() {
        var canvas = document.getElementById('skinCanvas');
        var loadingText = document.getElementById('loadingText');

        if (!canvas || !loadingText) {
            console.error('皮肤查看器元素未找到');
            return;
        }

        if (typeof skinview3d === 'undefined') {
            loadingText.textContent = '❌ skinview3d 未加载，请刷新后重试';
            loadingText.style.color = '#ff6b6b';
            return;
        }

        try {
            // ===== 获取容器尺寸，限制最大尺寸避免 WebGL 纹理溢出 =====
            var container = canvas.parentElement;
            var rect = container.getBoundingClientRect();
            
            // 最大纹理尺寸限制（WebGL 通常支持 4096x4096，这里保守设为 2048）
            var MAX_SIZE = 2048;
            // 像素比（设备缩放）
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            
            // 计算实际尺寸（限制最大尺寸）
            var w = Math.max(rect.width - 20, 200);
            var h = Math.min(w * 1.2, 500);
            
            // 乘以像素比，但不超过最大限制
            var canvasW = Math.min(Math.floor(w * dpr), MAX_SIZE);
            var canvasH = Math.min(Math.floor(h * dpr), MAX_SIZE);
            
            canvas.width = canvasW;
            canvas.height = canvasH;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';

            console.log('Canvas 尺寸:', canvas.width, 'x', canvas.height);

            // ===== 创建查看器 =====
            var viewer = new skinview3d.SkinViewer({
                canvas: canvas,
                width: canvas.width,
                height: canvas.height,
                skin: 'https://crafatar.com/skins/Notch',
                background: 0x0a0a14,
            });

            // ===== 设置默认视角 =====
            viewer.zoom = 0.8;
            viewer.autoRotate = true;
            viewer.autoRotateSpeed = 2.0;
            loadingText.style.display = 'none';

            // ============================================================
            // 控制函数
            // ============================================================
            var isWalking = false;
            var walkAnimation = null;

            function loadPlayerSkin() {
                var username = document.getElementById('usernameInput').value.trim();
                if (!username) {
                    alert('请输入玩家名称');
                    return;
                }
                loadingText.style.display = 'block';
                loadingText.textContent = '加载中...';
                loadingText.style.color = 'var(--text-muted)';
                var skinUrl = 'https://crafatar.com/skins/' + encodeURIComponent(username);
                viewer.loadSkin(skinUrl, function() {
                    loadingText.style.display = 'none';
                    console.log('加载成功:', username);
                }, function(err) {
                    loadingText.textContent = '⚠️ 加载失败，请尝试使用自定义 URL';
                    loadingText.style.color = '#ffb347';
                    console.error(err);
                });
            }

            function loadCustomSkin() {
                var url = document.getElementById('skinUrlInput').value.trim();
                if (!url) {
                    alert('请输入皮肤图片 URL');
                    return;
                }
                loadingText.style.display = 'block';
                loadingText.textContent = '加载中...';
                loadingText.style.color = 'var(--text-muted)';
                viewer.loadSkin(url, function() {
                    loadingText.style.display = 'none';
                    console.log('加载成功:', url);
                }, function(err) {
                    loadingText.textContent = '❌ 加载失败，请检查 URL 是否正确';
                    loadingText.style.color = '#ff6b6b';
                    console.error(err);
                });
            }

            function toggleAutoRotate() {
                viewer.autoRotate = !viewer.autoRotate;
                var btn = document.getElementById('autoRotateBtn');
                if (btn) {
                    btn.textContent = viewer.autoRotate ? '⏸ 暂停旋转' : '▶️ 恢复旋转';
                }
            }

            function toggleWalking() {
                isWalking = !isWalking;
                var btn = document.getElementById('walkingBtn');
                if (isWalking) {
                    walkAnimation = new skinview3d.WalkingAnimation();
                    viewer.animation = walkAnimation;
                    if (btn) btn.textContent = '⏹ 停止行走';
                } else {
                    viewer.animation = null;
                    if (btn) btn.textContent = '🚶 行走动画';
                }
            }

            function resetView() {
                viewer.zoom = 0.8;
                viewer.camera.position.set(1.2, 0.8, 2.0);
                viewer.camera.lookAt(0, 1.2, 0);
                if (viewer.controls) {
                    viewer.controls.target.set(0, 1.2, 0);
                }
            }

            // ============================================================
            // 绑定按钮事件
            // ============================================================
            var loadSkinBtn = document.getElementById('loadSkinBtn');
            var loadCustomBtn = document.getElementById('loadCustomBtn');
            var autoRotateBtn = document.getElementById('autoRotateBtn');
            var walkingBtn = document.getElementById('walkingBtn');
            var resetBtn = document.getElementById('resetBtn');
            var usernameInput = document.getElementById('usernameInput');
            var skinUrlInput = document.getElementById('skinUrlInput');

            if (loadSkinBtn) loadSkinBtn.addEventListener('click', loadPlayerSkin);
            if (loadCustomBtn) loadCustomBtn.addEventListener('click', loadCustomSkin);
            if (autoRotateBtn) autoRotateBtn.addEventListener('click', toggleAutoRotate);
            if (walkingBtn) walkingBtn.addEventListener('click', toggleWalking);
            if (resetBtn) resetBtn.addEventListener('click', resetView);

            if (usernameInput) {
                usernameInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') loadPlayerSkin();
                });
            }
            if (skinUrlInput) {
                skinUrlInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') loadCustomSkin();
                });
            }

            // ============================================================
            // 自适应 Canvas 大小（防止纹理溢出）
            // ============================================================
            var resizeTimer = null;

            function resizeCanvas() {
                var container = canvas.parentElement;
                var rect = container.getBoundingClientRect();
                
                var w = Math.max(rect.width - 20, 200);
                var h = Math.min(w * 1.2, 500);
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                
                var newW = Math.min(Math.floor(w * dpr), MAX_SIZE);
                var newH = Math.min(Math.floor(h * dpr), MAX_SIZE);
                
                // 只有尺寸变化超过 2px 才更新
                if (Math.abs(canvas.width - newW) > 2 || Math.abs(canvas.height - newH) > 2) {
                    canvas.width = newW;
                    canvas.height = newH;
                    canvas.style.width = w + 'px';
                    canvas.style.height = h + 'px';
                    viewer.width = canvas.width;
                    viewer.height = canvas.height;
                    viewer.render();
                    console.log('Canvas 已调整:', canvas.width, 'x', canvas.height);
                }
            }

            // 防抖：避免频繁 resize
            function debouncedResize() {
                if (resizeTimer) {
                    cancelAnimationFrame(resizeTimer);
                }
                resizeTimer = requestAnimationFrame(function() {
                    resizeCanvas();
                    resizeTimer = null;
                });
            }

            // 使用 ResizeObserver 监听容器变化
            if (window.ResizeObserver) {
                var resizeObserver = new ResizeObserver(function() {
                    debouncedResize();
                });
                resizeObserver.observe(container);
            }

            window.addEventListener('resize', debouncedResize);

            // 初始调整
            setTimeout(debouncedResize, 100);
            setTimeout(debouncedResize, 300);

            console.log('🎮 皮肤查看器已启动');

        } catch (error) {
            loadingText.textContent = '❌ 初始化失败: ' + error.message;
            loadingText.style.color = '#ff6b6b';
            console.error('皮肤查看器初始化失败:', error);
        }
    }
</script>
