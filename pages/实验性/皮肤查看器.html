<!-- ===== 使用 importmap 加载 skinview3d ESM 版本 ===== -->
<script type="importmap">
{
    "imports": {
        "skinview3d": "https://cdn.jsdelivr.net/npm/skinview3d@3.0.0/dist/skinview3d.module.js"
    }
}
</script>

<script type="module">
    // ============================================================
    // 导入 skinview3d
    // ============================================================
    import * as skinview3d from 'skinview3d';

    // ============================================================
    // 初始化皮肤查看器
    // ============================================================
    var canvas = document.getElementById('skinCanvas');
    var loadingText = document.getElementById('loadingText');

    // 检查 skinview3d 是否加载成功
    if (typeof skinview3d === 'undefined') {
        loadingText.textContent = '❌ skinview3d 模块加载失败，请检查网络连接';
        loadingText.style.color = '#ff6b6b';
        console.error('skinview3d 模块未加载');
        throw new Error('skinview3d 模块未加载');
    }

    try {
        // 1. 先设置 Canvas 尺寸，确保有效
        var container = canvas.parentElement;
        var rect = container.getBoundingClientRect();
        var w = Math.max(rect.width - 20, 280);
        var h = Math.min(w * 1.2, 500);
        var dpr = Math.min(window.devicePixelRatio || 1, 1.5); // 限制最大像素比
        
        // 限制最大尺寸，防止 WebGL 纹理溢出
        var MAX_SIZE = 1024; 
        var canvasW = Math.min(Math.floor(w * dpr), MAX_SIZE);
        var canvasH = Math.min(Math.floor(h * dpr), MAX_SIZE);
        
        canvas.width = canvasW;
        canvas.height = canvasH;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        // 2. 创建查看器
        var viewer = new skinview3d.SkinViewer({
            canvas: canvas,
            width: canvas.width,
            height: canvas.height,
            skin: 'https://crafatar.com/skins/Notch', // 这里仍可能有CORS问题，但不影响启动
            background: 0x0a0a14,
        });

        // 3. 设置默认视角
        viewer.zoom = 0.8;
        viewer.autoRotate = true;
        viewer.autoRotateSpeed = 2.0;
        loadingText.style.display = 'none';

        // ============================================================
        // 控制函数（与之前保持一致，略作精简）
        // ============================================================
        var isWalking = false;
        var walkAnimation = null;

        function loadPlayerSkin() {
            var username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert('请输入玩家名称');
                return;
            }
            loadingText.style.display = 'block';
            loadingText.textContent = '加载中...';
            loadingText.style.color = 'var(--text-muted)';
            var skinUrl = 'https://crafatar.com/skins/' + encodeURIComponent(username);
            viewer.loadSkin(skinUrl, function() {
                loadingText.style.display = 'none';
                console.log('加载成功:', username);
            }, function(err) {
                loadingText.textContent = '⚠️ 加载失败，可尝试使用自定义 URL';
                loadingText.style.color = '#ffb347';
                console.error(err);
            });
        }

        function loadCustomSkin() {
            var url = document.getElementById('skinUrlInput').value.trim();
            if (!url) {
                alert('请输入皮肤图片 URL');
                return;
            }
            loadingText.style.display = 'block';
            loadingText.textContent = '加载中...';
            loadingText.style.color = 'var(--text-muted)';
            viewer.loadSkin(url, function() {
                loadingText.style.display = 'none';
                console.log('加载成功:', url);
            }, function(err) {
                loadingText.textContent = '❌ 加载失败，请检查 URL 是否正确';
                loadingText.style.color = '#ff6b6b';
                console.error(err);
            });
        }

        function toggleAutoRotate() {
            viewer.autoRotate = !viewer.autoRotate;
            document.getElementById('autoRotateBtn').textContent = viewer.autoRotate ? '⏸ 暂停旋转' : '▶️ 恢复旋转';
        }

        function toggleWalking() {
            isWalking = !isWalking;
            if (isWalking) {
                walkAnimation = new skinview3d.WalkingAnimation();
                viewer.animation = walkAnimation;
                document.getElementById('walkingBtn').textContent = '⏹ 停止行走';
            } else {
                viewer.animation = null;
                document.getElementById('walkingBtn').textContent = '🚶 行走动画';
            }
        }

        function resetView() {
            viewer.zoom = 0.8;
            viewer.camera.position.set(1.2, 0.8, 2.0);
            viewer.camera.lookAt(0, 1.2, 0);
            if (viewer.controls) {
                viewer.controls.target.set(0, 1.2, 0);
            }
        }

        // ============================================================
        // 绑定按钮事件
        // ============================================================
        document.getElementById('loadSkinBtn').addEventListener('click', loadPlayerSkin);
        document.getElementById('loadCustomBtn').addEventListener('click', loadCustomSkin);
        document.getElementById('autoRotateBtn').addEventListener('click', toggleAutoRotate);
        document.getElementById('walkingBtn').addEventListener('click', toggleWalking);
        document.getElementById('resetBtn').addEventListener('click', resetView);

        document.getElementById('usernameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loadPlayerSkin();
        });
        document.getElementById('skinUrlInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loadCustomSkin();
        });

        // ============================================================
        // 自适应 Canvas 大小（使用防抖优化）
        // ============================================================
        var resizeTimer = null;
        function resizeCanvas() {
            var container = canvas.parentElement;
            var rect = container.getBoundingClientRect();
            var w = Math.max(rect.width - 20, 280);
            var h = Math.min(w * 1.2, 500);
            var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            var newW = Math.min(Math.floor(w * dpr), MAX_SIZE);
            var newH = Math.min(Math.floor(h * dpr), MAX_SIZE);
            
            if (Math.abs(canvas.width - newW) > 2 || Math.abs(canvas.height - newH) > 2) {
                canvas.width = newW;
                canvas.height = newH;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                viewer.width = canvas.width;
                viewer.height = canvas.height;
                viewer.render();
            }
        }

        function debouncedResize() {
            if (resizeTimer) {
                cancelAnimationFrame(resizeTimer);
            }
            resizeTimer = requestAnimationFrame(function() {
                resizeCanvas();
                resizeTimer = null;
            });
        }

        if (window.ResizeObserver) {
            var resizeObserver = new ResizeObserver(function() {
                debouncedResize();
            });
            resizeObserver.observe(container);
        }
        window.addEventListener('resize', debouncedResize);

        setTimeout(debouncedResize, 100);
        setTimeout(debouncedResize, 300);

        console.log('🎮 皮肤查看器已启动 (ESM模式)');

    } catch (error) {
        loadingText.textContent = '❌ 初始化失败: ' + error.message;
        loadingText.style.color = '#ff6b6b';
        console.error('皮肤查看器初始化失败:', error);
    }
</script>
