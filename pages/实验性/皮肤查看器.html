<div class="doc-content">
    <h1>🧪 实验性 · Minecraft 皮肤查看器</h1>
    <p style="color:var(--text-secondary);">基于 skinview3d 的 3D 皮肤展示 · 输入玩家名称或皮肤图片 URL</p>

    <div style="display:flex;flex-wrap:wrap;gap:1.5rem;margin:1.5rem 0;">
        <!-- 左侧：控制区 -->
        <div style="flex:1;min-width:200px;background:rgba(255,255,255,0.03);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border-color);">
            <h3 style="margin-bottom:0.5rem;">🎮 控制面板</h3>
            
            <div style="margin-bottom:1rem;">
                <label style="display:block;color:var(--text-secondary);font-size:0.9rem;margin-bottom:0.3rem;">玩家名称</label>
                <input type="text" id="usernameInput" value="Notch" placeholder="输入玩家名称..." style="width:100%;padding:0.5rem;border-radius:6px;border:1px solid var(--border-color);background:rgba(255,255,255,0.05);color:var(--text-primary);font-family:var(--font-pixel);font-size:0.9rem;outline:none;">
                <button onclick="loadPlayerSkin()" style="margin-top:0.5rem;padding:0.4rem 1rem;border-radius:6px;border:none;background:var(--accent);color:#fff;font-family:var(--font-pixel);cursor:pointer;">加载皮肤</button>
            </div>

            <div style="border-top:1px solid var(--border-color);padding-top:1rem;margin-bottom:1rem;">
                <p style="color:var(--text-muted);font-size:0.8rem;">或直接输入皮肤图片 URL：</p>
                <input type="text" id="skinUrlInput" placeholder="https://example.com/skin.png" style="width:100%;padding:0.5rem;border-radius:6px;border:1px solid var(--border-color);background:rgba(255,255,255,0.05);color:var(--text-primary);font-size:0.85rem;outline:none;">
                <button onclick="loadCustomSkin()" style="margin-top:0.5rem;padding:0.4rem 1rem;border-radius:6px;border:none;background:var(--accent);color:#fff;font-family:var(--font-pixel);cursor:pointer;">加载自定义</button>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;border-top:1px solid var(--border-color);padding-top:1rem;">
                <button onclick="toggleAutoRotate()" id="autoRotateBtn" style="padding:0.3rem 0.8rem;border-radius:6px;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);font-family:var(--font-pixel);cursor:pointer;font-size:0.8rem;">⏸ 暂停旋转</button>
                <button onclick="toggleWalking()" id="walkingBtn" style="padding:0.3rem 0.8rem;border-radius:6px;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);font-family:var(--font-pixel);cursor:pointer;font-size:0.8rem;">🚶 行走动画</button>
                <button onclick="resetView()" style="padding:0.3rem 0.8rem;border-radius:6px;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);font-family:var(--font-pixel);cursor:pointer;font-size:0.8rem;">↺ 重置视角</button>
            </div>

            <div style="border-top:1px solid var(--border-color);padding-top:1rem;margin-top:1rem;">
                <p style="color:var(--text-muted);font-size:0.8rem;">💡 提示：鼠标拖拽旋转 · 滚轮缩放</p>
            </div>
        </div>

        <!-- 右侧：皮肤展示 -->
        <div style="flex:2;min-width:280px;background:rgba(255,255,255,0.02);border-radius:var(--radius);border:1px solid var(--border-color);display:flex;justify-content:center;align-items:center;min-height:400px;position:relative;">
            <canvas id="skinCanvas" style="display:block;width:100%;height:100%;max-height:500px;image-rendering:pixelated;"></canvas>
            <div id="loadingText" style="position:absolute;color:var(--text-muted);font-size:0.9rem;pointer-events:none;">加载中...</div>
        </div>
    </div>

    <div style="background:rgba(255,255,255,0.02);border-radius:var(--radius);padding:1rem 1.5rem;border:1px solid var(--border-color);">
        <p style="color:var(--text-muted);font-size:0.85rem;">📌 支持的玩家名称：任何正版 Minecraft 玩家名称（通过 crafatar.com 获取皮肤）</p>
        <p style="color:var(--text-muted);font-size:0.85rem;">🔗 皮肤来源：<a href="https://crafatar.com" target="_blank">crafatar.com</a> · 3D 引擎：<a href="https://github.com/bs-community/skinview3d" target="_blank">skinview3d</a></p>
    </div>

    <div class="footnote">
        <p>实验性功能 · 方块狂想曲 Wiki</p>
    </div>
</div>

<!-- ===== CDN 引用（使用国内稳定镜像） ===== -->
<script src="https://cdn.staticfile.org/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/dist/skinview3d.min.js"></script>

<script>
    // ============================================================
    // 皮肤查看器核心逻辑
    // ============================================================

    // 等待 DOM 和依赖库加载完成
    function initSkinViewer() {
        var canvas = document.getElementById('skinCanvas');
        var loadingText = document.getElementById('loadingText');

        // 检查 Three.js 是否加载成功
        if (typeof THREE === 'undefined') {
            loadingText.textContent = '❌ Three.js 加载失败，请刷新重试';
            loadingText.style.color = '#ff6b6b';
            console.error('Three.js 未加载');
            // 尝试重新加载
            return;
        }

        // 检查 skinview3d 是否加载成功
        if (typeof skinview3d === 'undefined') {
            loadingText.textContent = '❌ skinview3d 加载失败，请刷新重试';
            loadingText.style.color = '#ff6b6b';
            console.error('skinview3d 未加载');
            return;
        }

        try {
            // 创建查看器
            var viewer = new skinview3d.SkinViewer({
                canvas: canvas,
                width: 400,
                height: 500,
                skin: 'https://crafatar.com/skins/Notch',
                background: 0x0a0a14,
            });

            // 设置场景背景
            viewer.scene.background = new THREE.Color(0x0a0a14);

            // 设置默认视角
            viewer.zoom = 0.8;
            viewer.autoRotate = true;
            viewer.autoRotateSpeed = 2.0;
            loadingText.style.display = 'none';

            // 保存到全局变量供其他函数使用
            window._skinViewer = viewer;

            // 当前动画状态
            var isWalking = false;
            var walkAnimation = null;

            // ============================================================
            // 函数：加载玩家皮肤
            // ============================================================
            window.loadPlayerSkin = function() {
                var username = document.getElementById('usernameInput').value.trim();
                if (!username) {
                    alert('请输入玩家名称');
                    return;
                }
                loadingText.style.display = 'block';
                loadingText.textContent = '加载中...';
                loadingText.style.color = 'var(--text-muted)';
                var skinUrl = 'https://crafatar.com/skins/' + encodeURIComponent(username);
                window._skinViewer.loadSkin(skinUrl, function() {
                    loadingText.style.display = 'none';
                    console.log('加载成功:', username);
                }, function(err) {
                    loadingText.textContent = '❌ 加载失败，请检查玩家名称';
                    loadingText.style.color = '#ff6b6b';
                    console.error(err);
                });
            };

            // ============================================================
            // 函数：加载自定义皮肤 URL
            // ============================================================
            window.loadCustomSkin = function() {
                var url = document.getElementById('skinUrlInput').value.trim();
                if (!url) {
                    alert('请输入皮肤图片 URL');
                    return;
                }
                loadingText.style.display = 'block';
                loadingText.textContent = '加载中...';
                loadingText.style.color = 'var(--text-muted)';
                window._skinViewer.loadSkin(url, function() {
                    loadingText.style.display = 'none';
                    console.log('加载成功:', url);
                }, function(err) {
                    loadingText.textContent = '❌ 加载失败，请检查 URL 是否正确';
                    loadingText.style.color = '#ff6b6b';
                    console.error(err);
                });
            };

            // ============================================================
            // 函数：切换自动旋转
            // ============================================================
            window.toggleAutoRotate = function() {
                var viewer = window._skinViewer;
                viewer.autoRotate = !viewer.autoRotate;
                document.getElementById('autoRotateBtn').textContent = viewer.autoRotate ? '⏸ 暂停旋转' : '▶️ 恢复旋转';
            };

            // ============================================================
            // 函数：切换行走动画
            // ============================================================
            window.toggleWalking = function() {
                var viewer = window._skinViewer;
                isWalking = !isWalking;
                if (isWalking) {
                    walkAnimation = new skinview3d.WalkingAnimation();
                    viewer.animation = walkAnimation;
                    document.getElementById('walkingBtn').textContent = '⏹ 停止行走';
                } else {
                    viewer.animation = null;
                    document.getElementById('walkingBtn').textContent = '🚶 行走动画';
                }
            };

            // ============================================================
            // 函数：重置视角
            // ============================================================
            window.resetView = function() {
                var viewer = window._skinViewer;
                viewer.zoom = 0.8;
                viewer.camera.position.set(1.2, 0.8, 2.0);
                viewer.camera.lookAt(0, 1.2, 0);
                if (viewer.controls) {
                    viewer.controls.target.set(0, 1.2, 0);
                }
            };

            // ============================================================
            // 自适应 Canvas 大小
            // ============================================================
            function resizeCanvas() {
                var container = canvas.parentElement;
                var rect = container.getBoundingClientRect();
                var w = rect.width - 20;
                var h = Math.min(w * 1.2, 500);
                canvas.width = w * 2;
                canvas.height = h * 2;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                if (window._skinViewer) {
                    window._skinViewer.width = w * 2;
                    window._skinViewer.height = h * 2;
                    window._skinViewer.render();
                }
            }

            window.addEventListener('resize', resizeCanvas);
            setTimeout(resizeCanvas, 200);

            // ============================================================
            // 回车键触发加载
            // ============================================================
            document.getElementById('usernameInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') window.loadPlayerSkin();
            });
            document.getElementById('skinUrlInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') window.loadCustomSkin();
            });

            console.log('🎮 皮肤查看器已启动');
            
        } catch (error) {
            loadingText.textContent = '❌ 初始化失败: ' + error.message;
            loadingText.style.color = '#ff6b6b';
            console.error('皮肤查看器初始化失败:', error);
        }
    }

    // ============================================================
    // 等待 DOM 加载完成后再初始化
    // ============================================================
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSkinViewer);
    } else {
        // 如果 DOM 已加载，延迟执行以确保脚本加载完成
        setTimeout(initSkinViewer, 300);
    }

    // 如果脚本加载失败，显示友好的错误提示
    window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT') {
            var loadingText = document.getElementById('loadingText');
            if (loadingText) {
                loadingText.textContent = '❌ 脚本加载失败，请刷新页面重试';
                loadingText.style.color = '#ff6b6b';
            }
        }
    });
</script>
