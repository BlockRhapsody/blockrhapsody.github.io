<div class="doc-content">
    <h1>🔄 强刷新工具</h1>
    <p style="color:var(--text-secondary);">清除所有本地缓存数据，保留登录状态 · 用于解决页面加载异常或版本更新问题</p>

    <div style="display:flex;flex-direction:column;gap:1.5rem;margin:1.5rem 0;">
        
        <!-- ===== 状态卡片 ===== -->
        <div style="background:rgba(255,255,255,0.03);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border-color);">
            <h3 style="margin-bottom:0.8rem;">当前缓存状态</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem 1.5rem;font-size:clamp(0.85rem, 1vw, 1rem);">
                <span style="color:var(--text-secondary);">已缓存页面数：</span>
                <span id="cacheCount" style="color:var(--text-primary);">0</span>
                <span style="color:var(--text-secondary);">本地存储项：</span>
                <span id="localStorageCount" style="color:var(--text-primary);">0</span>
                <span style="color:var(--text-secondary);">会话存储项：</span>
                <span id="sessionStorageCount" style="color:var(--text-primary);">0</span>
                <span style="color:var(--text-secondary);">当前版本号：</span>
                <span id="versionDisplay" style="color:var(--text-primary);">加载中...</span>
            </div>
        </div>

        <!-- ===== 强刷新按钮 ===== -->
        <div style="display:flex;flex-wrap:wrap;gap:1rem;">
            <button id="hardRefreshBtn" style="flex:1;min-width:200px;padding:0.8rem 2rem;border-radius:var(--radius);border:2px solid var(--accent);background:rgba(76,175,80,0.12);color:var(--accent);font-family:var(--font-pixel);font-size:1rem;cursor:pointer;transition:all var(--transition);">
                执行强刷新
            </button>
            <button id="clearAllBtn" style="flex:1;min-width:200px;padding:0.8rem 2rem;border-radius:var(--radius);border:2px solid #ff6b6b;background:rgba(255,107,107,0.10);color:#ff6b6b;font-family:var(--font-pixel);font-size:1rem;cursor:pointer;transition:all var(--transition);">
                清除所有数据
            </button>
        </div>

        <!-- ===== 执行日志 ===== -->
        <div style="background:rgba(0,0,0,0.3);border-radius:var(--radius);padding:1rem 1.5rem;border:1px solid var(--border-color);font-family:'Courier New',monospace;font-size:0.85rem;max-height:200px;overflow-y:auto;color:var(--text-secondary);">
            <div id="logContainer">
                <div>📋 准备就绪，等待操作...</div>
            </div>
        </div>

        <!-- ===== 提示 ===== -->
        <div class="highlight-box" style="border-left-color:#ffb347;">
            <p><strong>强刷新说明</strong></p>
            <ul style="margin-top:0.4rem;font-size:clamp(0.9rem, 1.2vw, 1rem);">
                <li><strong>保留登录：</strong>用户名和登录状态</li>
                <li><strong>清除内容：</strong>所有页面缓存、版本号、本地存储中的其他数据</li>
                <li><strong>适用场景：</strong>页面加载异常、缓存冲突、版本更新后内容不刷新</li>
            </ul>
        </div>
    </div>

    <div class="footnote">
        <p>方块狂想曲 · 实验性功能</p>
    </div>
</div>

<script>
    // ============================================================
    // 页面初始化函数（由 reExecuteScripts 调用）
    // ============================================================
    (function initPage() {
        // 更新状态显示
        function updateStats() {
            var cacheCount = 0;
            var sessionKeys = Object.keys(sessionStorage);
            sessionKeys.forEach(function(key) {
                if (key.startsWith('page_')) {
                    cacheCount++;
                }
            });
            var cacheEl = document.getElementById('cacheCount');
            var localEl = document.getElementById('localStorageCount');
            var sessionEl = document.getElementById('sessionStorageCount');
            var versionEl = document.getElementById('versionDisplay');
            
            if (cacheEl) cacheEl.textContent = cacheCount;
            if (localEl) localEl.textContent = Object.keys(localStorage).length;
            if (sessionEl) sessionEl.textContent = Object.keys(sessionStorage).length;
            
            var version = localStorage.getItem('app_version') || '未设置';
            if (versionEl) versionEl.textContent = version;
        }

        function log(message, type) {
            var container = document.getElementById('logContainer');
            if (!container) return;
            
            var colors = {
                info: 'var(--text-secondary)',
                success: '#4CAF50',
                warning: '#ffb347',
                error: '#ff6b6b'
            };
            var color = colors[type] || colors.info;
            var entry = document.createElement('div');
            entry.style.color = color;
            entry.textContent = '> ' + message;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        // 强刷新（保留登录数据）
        function hardRefresh() {
            log('开始执行强刷新...', 'info');
            
            var token = localStorage.getItem('token');
            var username = localStorage.getItem('username');
            log('已保存登录数据: ' + (username || '未登录'), 'info');
            
            var keysToRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                if (key !== 'token' && key !== 'username') {
                    keysToRemove.push(key);
                }
            }
            keysToRemove.forEach(function(key) {
                localStorage.removeItem(key);
            });
            log('已清除 ' + keysToRemove.length + ' 项本地存储数据', 'success');
            
            var sessionCount = sessionStorage.length;
            sessionStorage.clear();
            log('已清除 ' + sessionCount + ' 项会话存储数据', 'success');
            
            if (token) localStorage.setItem('token', token);
            if (username) localStorage.setItem('username', username);
            log('已恢复登录数据: ' + (username || '未登录'), 'success');
            
            var newVersion = new Date().toISOString().slice(0, 10).replace(/-/g, '') + '.' + String(Date.now()).slice(-6);
            localStorage.setItem('app_version', newVersion);
            log('新版本号已设置: ' + newVersion, 'info');
            
            updateStats();
            log('强刷新完成！3秒后自动刷新页面...', 'success');
            
            setTimeout(function() {
                location.reload();
            }, 3000);
        }

        // 清除所有数据（含登录）
        function clearAllData() {
            if (!confirm('确定要清除所有数据吗？\n\n这将清除：\n• 所有本地存储数据\n• 所有会话存储数据\n• 所有缓存页面\n• 登录状态\n\n此操作不可撤销！')) {
                log('操作已取消', 'warning');
                return;
            }
            
            log('开始清除所有数据...', 'info');
            localStorage.clear();
            sessionStorage.clear();
            log('已清除所有本地存储和会话存储数据', 'success');
            log('清除完成！3秒后自动刷新页面...', 'success');
            updateStats();
            
            setTimeout(function() {
                location.reload();
            }, 3000);
        }

        // 绑定按钮事件
        var refreshBtn = document.getElementById('hardRefreshBtn');
        var clearBtn = document.getElementById('clearAllBtn');
        
        if (refreshBtn) {
            refreshBtn.removeEventListener('click', hardRefresh);
            refreshBtn.addEventListener('click', hardRefresh);
        }
        if (clearBtn) {
            clearBtn.removeEventListener('click', clearAllData);
            clearBtn.addEventListener('click', clearAllData);
        }

        // 初始化
        updateStats();
        log('强刷新工具已加载', 'success');
        log('点击"执行强刷新"清除缓存并保留登录状态', 'info');
    })();
</script>
