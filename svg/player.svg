<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- 头部背景 -->
    <rect x="4" y="4" width="56" height="56" rx="12" fill="currentColor" opacity="0.15"/>
    <!-- 头部（Minecraft 风格方块头） -->
    <rect x="12" y="8" width="40" height="40" rx="4" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width="2"/>
    <!-- 两只眼睛 -->
    <rect x="18" y="20" width="8" height="10" rx="2" fill="currentColor"/>
    <rect x="38" y="20" width="8" height="10" rx="2" fill="currentColor"/>
    <!-- 嘴巴 -->
    <rect x="22" y="34" width="20" height="4" rx="2" fill="currentColor"/>
    <!-- 身体（Minecraft 风格方块身体） -->
    <rect x="16" y="48" width="32" height="12" rx="2" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
</svg>
