<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- 结构方块主体 -->
    <rect x="4" y="4" width="56" height="56" rx="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2"/>
    <!-- 外框装饰线 -->
    <rect x="12" y="12" width="40" height="40" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
    <!-- 内部网格（表示结构方块的特性） -->
    <line x1="12" y1="32" x2="52" y2="32" stroke="currentColor" stroke-width="1" opacity="0.3"/>
    <line x1="32" y1="12" x2="32" y2="52" stroke="currentColor" stroke-width="1" opacity="0.3"/>
    <!-- 中心小方块 -->
    <rect x="26" y="26" width="12" height="12" rx="2" fill="currentColor" opacity="0.4"/>
</svg>
