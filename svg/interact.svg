<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- 手指（食指伸出，类似点击） -->
    <!-- 手掌 -->
    <rect x="20" y="20" width="24" height="28" rx="4" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="2"/>
    <!-- 食指伸出 -->
    <rect x="14" y="10" width="10" height="24" rx="5" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="2"/>
    <!-- 食指指尖 -->
    <circle cx="19" cy="10" r="5" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
    <!-- 点击波纹效果 -->
    <circle cx="19" cy="44" r="6" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6">
        <animate attributeName="r" from="6" to="18" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.6" to="0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="19" cy="44" r="6" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6">
        <animate attributeName="r" from="6" to="18" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.6" to="0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 点击目标点 -->
    <circle cx="19" cy="44" r="3" fill="currentColor" opacity="0.5"/>
</svg>
