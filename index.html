<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>方块狂想曲 · Wiki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="icon" type="image/png" href="/icon/Structure_Block_1.png" />
    <meta name="description" content="方块狂想曲服务器 · 制度汇编 · 技术文档 · 玩家指南" />
    <meta name="theme-color" content="#0d0d1a" />
    <style>
        /* ===== 全局重置与基础变量 ===== */
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg-primary:#0a0a14;--bg-secondary:#12122a;--bg-card:#1a1a3e;--bg-sidebar:#0e0e22;--border-color:#2a2a5a;--text-primary:#ececf0;--text-secondary:#9a9abe;--text-muted:#6a6a8a;--accent:#4CAF50;--accent-hover:#66BB6A;--accent-glow:rgba(76,175,80,0.25);--font-pixel:'Pixelify Sans','Courier New',monospace;--radius:16px;--transition:0.35s cubic-bezier(0.34,1.56,0.64,1);--bounce:0.5s cubic-bezier(0.34, 1.56, 0.64, 1);--smooth:0.4s cubic-bezier(0.22, 1, 0.36, 1);--gentle:0.6s cubic-bezier(0.34, 1.2, 0.64, 1)}
        html{scroll-behavior:smooth}
        body{font-family:var(--font-pixel);background:var(--bg-primary);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;opacity:0;transition:opacity 0.5s ease;background-image:radial-gradient(ellipse at 20% 50%,rgba(76,175,80,0.06)0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(76,175,80,0.04)0%,transparent 50%);background-attachment:fixed;overflow-x:hidden}
        body.loaded{opacity:1}
        a{color:var(--text-secondary);text-decoration:none;transition:color var(--transition)}
        a:hover{color:var(--text-primary)}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:var(--bg-primary)}
        ::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:8px}
        ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

        /* ===== 导航栏 ===== */
        .navbar{position:sticky;top:0;z-index:100;background:rgba(10,10,20,0.85);backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--border-color);padding:0.7rem 1.5rem;transition:background var(--transition)}
        .nav-container{max-width:1440px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem}
        .nav-left{display:flex;align-items:center;gap:0.8rem}
        .nav-brand a{font-size:clamp(1.4rem, 3.5vw, 2.2rem);font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:0.6rem;letter-spacing:1px;transition:transform var(--transition);white-space:nowrap}
        .nav-brand a:hover{transform:scale(1.02)}
        .nav-brand img{height:clamp(32px, 4.5vw, 52px);width:auto;display:block;image-rendering:pixelated}

        /* ===== 汉堡菜单 ===== */
        .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;transition:all var(--smooth);z-index:101}
        .hamburger span{display:block;width:28px;height:3px;background:var(--text-primary);border-radius:4px;transition:all var(--smooth);transform-origin:center}
        .hamburger:hover span{background:var(--accent)}
        .hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px, 6px)}
        .hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
        .hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px, -6px)}

        .nav-actions{display:flex;align-items:center;gap:clamp(0.5rem, 1.2vw, 1.2rem);flex-shrink:0}
        .nav-btn{padding:clamp(0.35rem, 0.7vw, 0.6rem) clamp(0.8rem, 1.5vw, 1.5rem);border-radius:40px;font-size:clamp(0.8rem, 1.1vw, 1.05rem);font-weight:700;font-family:var(--font-pixel);background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:var(--text-secondary);cursor:pointer;transition:all var(--transition);display:inline-flex;align-items:center;gap:0.5rem;white-space:nowrap}
        .nav-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 30px var(--accent-glow);transform:translateY(-1px)}
        .nav-btn i{font-size:clamp(0.7rem, 1vw, 0.95rem)}

        /* ===== 房间号横幅 ===== */
        .room-banner{background:linear-gradient(135deg,#1b5e20,#2e7d32);padding:0.5rem 0;width:100%;border-bottom:2px solid #4CAF50;text-align:center;display:none;animation:slideDown 0.5s ease forwards}
        .room-banner.show{display:block}
        @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        .room-content{display:inline-flex;align-items:center;gap:0.8rem;font-size:clamp(0.9rem, 1.5vw, 1.2rem);color:#fff;flex-wrap:wrap;justify-content:center}
        .room-content i{color:rgba(255,255,255,0.7)}
        .room-content strong{font-size:clamp(1.2rem, 2.5vw, 2rem);font-weight:700;letter-spacing:3px;background:rgba(0,0,0,0.25);padding:0.05rem 0.8rem;border-radius:40px;text-shadow:0 2px 8px rgba(0,0,0,0.3);font-family:var(--font-pixel)}

        /* ===== 主体布局 ===== */
        .main-wrapper{display:flex;flex:1;max-width:1440px;margin:0 auto;width:100%;padding:0 1rem;gap:1.5rem;align-items:flex-start;position:relative}

        /* ===== 移动端侧边栏 ===== */
        .mobile-sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;background:rgba(10,10,20,0.98);backdrop-filter:blur(18px);border-right:1px solid var(--border-color);padding:4.5rem 0.8rem 1.5rem;z-index:60;overflow-y:auto;transform:translateX(-100%);transition:transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);will-change:transform;display:none}
        .mobile-sidebar.open{transform:translateX(0)}
        .mobile-sidebar::-webkit-scrollbar{width:4px}
        .mobile-sidebar::-webkit-scrollbar-track{background:transparent}
        .mobile-sidebar::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px}
        .mobile-sidebar .sidebar-nav ul{list-style:none;padding:0}

        /* ===== 移动端遮罩层 ===== */
        .mobile-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:55;opacity:0;visibility:hidden;transition:opacity 0.35s ease, visibility 0s 0.35s;pointer-events:none;backdrop-filter:blur(2px);display:none}
        .mobile-overlay.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 0.35s ease, visibility 0s 0s}

        /* ===== 桌面端侧边栏 ===== */
        .desktop-sidebar{width:280px;flex-shrink:0;background:rgba(14,14,34,0.7);backdrop-filter:blur(8px);border-radius:var(--radius);border:1px solid var(--border-color);padding:1.2rem 0.6rem;margin-top:1.5rem;height:fit-content;max-height:calc(100vh - 100px);overflow-y:auto;position:sticky;top:80px;transition:all var(--smooth);align-self:flex-start;display:block}
        .desktop-sidebar::-webkit-scrollbar{width:4px}
        .desktop-sidebar::-webkit-scrollbar-track{background:transparent;margin:0.5rem 0;border-radius:4px}
        .desktop-sidebar::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px}
        .desktop-sidebar::-webkit-scrollbar-thumb:hover{background:var(--accent)}
        .desktop-sidebar{scrollbar-width:thin;scrollbar-color:var(--border-color) transparent}
        .desktop-sidebar:hover{scrollbar-color:var(--accent) transparent}
        .desktop-sidebar .sidebar-nav ul{list-style:none;padding:0}

        /* ===== 侧边栏分类样式 ===== */
        .category{margin-bottom:0.2rem}
        .category-toggle{display:flex;align-items:center;gap:0.8rem;padding:0.6rem 0.8rem;font-size:clamp(1rem, 1.2vw, 1.15rem);font-weight:700;color:var(--text-secondary);cursor:pointer;border-radius:10px;transition:all var(--smooth);user-select:none;position:relative;background:transparent}
        .category-toggle:hover{background:rgba(255,255,255,0.06);color:var(--text-primary);transform:translateX(4px)}
        .category-toggle:hover i{color:var(--accent);transform:scale(1.1)}
        .category-toggle i{width:1.8rem;color:var(--text-muted);transition:all var(--bounce)}
        .category-toggle::after{content:'\f054';font-family:'Font Awesome 6 Free';font-weight:900;font-size:0.7rem;margin-left:auto;color:var(--text-muted);transition:transform var(--gentle), color var(--smooth)}
        .category-toggle.open::after{transform:rotate(90deg);color:var(--accent)}
        .sub-menu{list-style:none;padding-left:2.2rem;max-height:0;overflow:hidden;transition:max-height var(--gentle), opacity var(--smooth), transform var(--smooth);opacity:0;transform:translateY(-6px)}
        .sub-menu.open{max-height:800px;opacity:1;transform:translateY(0)}
        .sub-menu li{padding:0.3rem 0;transform:translateX(-4px);transition:transform var(--smooth)}
        .sub-menu.open li{transform:translateX(0)}
        .sub-menu a{font-size:clamp(0.9rem, 1.05vw, 1.0rem);color:var(--text-muted);display:block;padding:0.3rem 0.6rem;border-radius:6px;transition:all var(--smooth);position:relative;cursor:pointer}
        .sub-menu a::before{content:'';position:absolute;left:-0.8rem;top:50%;width:5px;height:5px;background:var(--text-muted);border-radius:50%;transform:translateY(-50%) scale(0);transition:all var(--bounce)}
        .sub-menu a:hover{background:rgba(255,255,255,0.06);color:var(--text-primary);padding-left:1.2rem;transform:translateX(2px)}
        .sub-menu a:hover::before{transform:translateY(-50%) scale(1);background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
        .sub-menu a.active{color:var(--accent);background:rgba(76,175,80,0.10);padding-left:1.2rem}
        .sub-menu a.active::before{transform:translateY(-50%) scale(1);background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}

        /* ===== 主内容区 ===== */
        .main-content{flex:1;padding:1.5rem 0 2rem;min-height:70vh;width:100%;max-width:100%;transition:all var(--smooth)}
        #home-content{animation:fadeUp 0.6s ease forwards}
        @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        
        #home-content h1{font-size:clamp(2.8rem, 6vw, 4.5rem);font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,#fff,#8ab4f8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.6rem;line-height:1.2}
        #home-content .subtitle{font-size:clamp(1.3rem, 1.8vw, 1.7rem);color:var(--text-secondary);margin-bottom:2.5rem;letter-spacing:2px}

        /* ===== 卡片 ===== */
        .card-grid{display:flex;flex-direction:column;gap:1.2rem;width:100%}
        .card{background:rgba(26,26,62,0.6);backdrop-filter:blur(4px);border:1px solid var(--border-color);border-radius:var(--radius);padding:clamp(1rem, 1.8vw, 1.8rem) clamp(1.2rem, 2.2vw, 2.2rem);transition:all var(--bounce);display:flex;flex-direction:column;gap:0.5rem;position:relative;overflow:hidden}
        .card:hover{transform:translateX(6px);border-color:var(--accent);box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 30px var(--accent-glow)}
        .card-title{font-size:clamp(1.4rem, 2vw, 1.8rem);font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:0.8rem}
        .card-title i{color:var(--accent);font-size:clamp(1.5rem, 2.2vw, 2.0rem);transition:transform var(--bounce)}
        .card:hover .card-title i{transform:scale(1.1) rotate(-4deg)}
        .card-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0.15rem}
        .card-list li{padding:clamp(0.35rem, 0.6vw, 0.6rem) clamp(0.6rem, 1vw, 1rem);border-radius:6px;color:var(--text-secondary);font-size:clamp(0.95rem, 1.2vw, 1.15rem);cursor:pointer;transition:all var(--smooth);list-style:none}
        .card-list li:hover{background:rgba(76,175,80,0.15);color:var(--text-primary);padding-left:clamp(0.8rem, 1.2vw, 1.2rem);transform:translateX(4px)}
        .card-list li i{margin-right:0.6rem;color:var(--text-muted);font-size:clamp(0.7rem, 0.9vw, 0.85rem);width:1.4rem;text-align:center;transition:all var(--smooth)}
        .card-list li:hover i{color:var(--accent);transform:scale(1.1)}
        .card-list li.active{color:var(--accent);background:rgba(76,175,80,0.08)}

        /* ===== 文档内容样式 ===== */
        .doc-content{max-width:900px;margin:0 auto;padding:0 0.5rem;animation:fadeUp 0.5s ease forwards}
        .doc-content h1{font-size:clamp(1.8rem, 4.5vw, 2.8rem);border-left:4px solid var(--accent);padding-left:1rem;margin-bottom:1.5rem;line-height:1.3}
        .doc-content h2{font-size:clamp(1.4rem, 3vw, 1.8rem);margin-top:2.5rem;padding-bottom:0.3rem;border-bottom:2px solid var(--border-color);color:var(--text-primary)}
        .doc-content h3{font-size:clamp(1.1rem, 2vw, 1.3rem);margin-top:1.8rem;color:#8ab4f8}
        .doc-content p{line-height:1.8;color:var(--text-secondary);margin-bottom:0.8rem;font-size:clamp(1rem, 1.8vw, 1.15rem)}
        .doc-content ul,.doc-content ol{padding-left:1.8rem;color:var(--text-secondary);line-height:1.8;font-size:clamp(1rem, 1.8vw, 1.15rem)}
        .doc-content li{margin-bottom:0.4rem}
        .doc-content .highlight-box{background:rgba(76,175,80,0.06);border-left:4px solid var(--accent);padding:clamp(1rem, 1.8vw, 1.5rem) clamp(1.2rem, 2vw, 1.8rem);border-radius:0 var(--radius) var(--radius) 0;margin:1.2rem 0}
        .doc-content .highlight-box strong{color:var(--text-primary)}
        .doc-content code{background:rgba(255,255,255,0.06);padding:0.1rem 0.4rem;border-radius:4px;font-family:'Courier New',monospace;font-size:0.9em;color:#d0d0e0}
        .doc-content table{width:100%;border-collapse:collapse;margin:1.2rem 0;font-size:clamp(0.9rem, 1.5vw, 1.05rem);display:block;overflow-x:auto}
        .doc-content th{background:var(--bg-secondary);color:var(--text-primary);padding:0.6rem 0.8rem;text-align:left;border:1px solid var(--border-color)}
        .doc-content td{padding:0.6rem 0.8rem;border:1px solid var(--border-color);color:var(--text-secondary)}
        .doc-content .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem 2rem;background:rgba(255,255,255,0.03);padding:1rem 1.5rem;border-radius:var(--radius);margin:1rem 0}
        .doc-content .info-grid span{color:var(--text-secondary);font-size:clamp(0.95rem, 1.5vw, 1.05rem)}
        .doc-content .info-grid strong{color:var(--text-primary)}
        .doc-content .footnote{font-size:clamp(0.85rem, 1.2vw, 0.95rem);color:var(--text-muted);border-top:1px solid var(--border-color);padding-top:1.5rem;margin-top:2.5rem}

        .loading-icon{width:48px;height:48px;image-rendering:pixelated;animation:breathe 1.2s ease-in-out infinite}
        @keyframes breathe{0%,100%{transform:scale(1);opacity:0.7}50%{transform:scale(1.12);opacity:1}}

        .footer{background:rgba(10,10,20,0.6);backdrop-filter:blur(8px);border-top:1px solid var(--border-color);text-align:center;padding:1.2rem 0;font-size:clamp(0.8rem, 1vw, 0.9rem);color:var(--text-muted);margin-top:1.5rem}
        .footer a{color:var(--text-secondary);transition:color var(--smooth)}
        .footer a:hover{color:var(--accent)}

        /* ===== 登录模态框 ===== */
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:1000;display:none;justify-content:center;align-items:center;animation:fadeIn 0.3s ease}
        .modal-overlay.active{display:flex}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .modal-box{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius);padding:clamp(1.5rem, 3vw, 2.5rem);max-width:420px;width:90%;box-shadow:0 24px 64px rgba(0,0,0,0.6);animation:scaleIn 0.3s ease}
        @keyframes scaleIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
        .modal-box h2{font-size:clamp(1.2rem, 2vw, 1.6rem);margin-bottom:0.3rem;color:var(--text-primary)}
        .modal-box .modal-sub{font-size:clamp(0.8rem, 0.9vw, 0.9rem);color:var(--text-muted);margin-bottom:1.5rem}
        .modal-box label{display:block;font-size:clamp(0.8rem, 0.9vw, 0.9rem);color:var(--text-secondary);margin-bottom:0.3rem}
        .modal-box input{width:100%;padding:0.6rem 0.8rem;border-radius:8px;border:1px solid var(--border-color);background:rgba(255,255,255,0.05);color:var(--text-primary);font-family:var(--font-pixel);font-size:clamp(0.85rem, 1vw, 1rem);outline:none;transition:border-color var(--smooth)}
        .modal-box input:focus{border-color:var(--accent)}
        .modal-box .input-group{margin-bottom:1rem}
        .modal-box .modal-actions{display:flex;gap:0.8rem;margin-top:1.2rem;flex-wrap:wrap}
        .modal-box .modal-actions .btn-primary{flex:1;padding:0.6rem 1.2rem;border-radius:40px;font-size:clamp(0.8rem, 0.9vw, 0.9rem);font-weight:700;font-family:var(--font-pixel);background:var(--accent);border:none;color:#fff;cursor:pointer;transition:all var(--bounce)}
        .modal-box .modal-actions .btn-primary:hover{background:var(--accent-hover);box-shadow:0 0 30px var(--accent-glow);transform:scale(1.02)}
        .modal-box .modal-actions .btn-secondary{padding:0.6rem 1.2rem;border-radius:40px;font-size:clamp(0.8rem, 0.9vw, 0.9rem);font-weight:700;font-family:var(--font-pixel);background:rgba(255,255,255,0.06);border:1px solid var(--border-color);color:var(--text-secondary);cursor:pointer;transition:all var(--smooth)}
        .modal-box .modal-actions .btn-secondary:hover{background:rgba(255,255,255,0.1);transform:scale(1.02)}
        .modal-box .modal-error{color:#ff6b6b;font-size:clamp(0.75rem, 0.8vw, 0.85rem);margin-top:0.5rem;display:none}
        .modal-box .modal-error.show{display:block}
        .hidden{display:none}

        @media(min-width:769px){
            .hamburger{display:none !important}
            .mobile-sidebar{display:none !important}
            .mobile-overlay{display:none !important}
            .desktop-sidebar{display:block !important}
            .main-content{max-width:100%}
        }
        @media(max-width:768px){
            .hamburger{display:flex}
            .mobile-sidebar{display:block}
            .mobile-overlay{display:block}
            .desktop-sidebar{display:none !important}
            .main-wrapper{padding:0 0.5rem}
            .navbar{padding:0.4rem 1rem}
            .nav-container{gap:0.5rem}
            .nav-brand a{font-size:clamp(1.1rem, 3vw, 1.4rem)}
            .nav-brand img{height:clamp(26px, 4vw, 36px)}
            .nav-btn{font-size:clamp(0.7rem, 1.2vw, 0.85rem);padding:clamp(0.2rem, 0.5vw, 0.35rem) clamp(0.5rem, 1vw, 0.9rem)}
            .card{padding:clamp(0.8rem, 1.5vw, 1.2rem) clamp(1rem, 2vw, 1.5rem)}
            .doc-content .info-grid{grid-template-columns:1fr;gap:0.4rem}
            #home-content h1{font-size:clamp(2.2rem, 7vw, 3.2rem)}
            #home-content .subtitle{font-size:clamp(1.0rem, 3vw, 1.3rem)}
            .category-toggle{font-size:clamp(1.1rem, 3.5vw, 1.3rem)}
            .sub-menu a{font-size:clamp(1rem, 3vw, 1.15rem)}
        }
        @media(max-width:480px){
            .nav-brand a{font-size:clamp(1.0rem, 3.5vw, 1.4rem)}
            .nav-brand img{height:clamp(24px, 4.5vw, 34px)}
            .nav-btn{font-size:clamp(0.6rem, 1.5vw, 0.8rem);padding:clamp(0.15rem, 0.5vw, 0.3rem) clamp(0.35rem, 0.8vw, 0.7rem)}
            #home-content h1{font-size:clamp(2.0rem, 8vw, 2.8rem)}
            #home-content .subtitle{font-size:clamp(0.9rem, 3vw, 1.1rem)}
            .mobile-sidebar{width:260px}
            .category-toggle{font-size:clamp(1.0rem, 3.5vw, 1.2rem)}
            .sub-menu a{font-size:clamp(0.95rem, 3vw, 1.05rem)}
            .doc-content h1{font-size:clamp(1.5rem, 5vw, 2rem)}
            .doc-content h2{font-size:clamp(1.2rem, 4vw, 1.5rem)}
            .doc-content p,.doc-content ul,.doc-content ol{font-size:clamp(0.9rem, 2.5vw, 1rem)}
            .doc-content .info-grid span{font-size:clamp(0.85rem, 2vw, 0.95rem)}
        }
    </style>
</head>
<body>
    <!-- ===== 导航栏 ===== -->
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <button class="hamburger" id="hamburgerBtn" aria-label="切换菜单">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="nav-brand">
                    <a href="/">
                        <img src="/icon/Structure_Block_1.png" alt="方块狂想曲" />
                        <span>方块狂想曲</span>
                    </a>
                </div>
            </div>
            <div class="nav-actions">
                <span id="userDisplay" style="display:none;color:var(--text-secondary);font-size:clamp(0.7rem, 0.9vw, 0.9rem);"><i class="fas fa-user"></i> <span id="usernameDisplay"></span></span>
                <a id="loginBtn" href="#" class="nav-btn" onclick="openLoginModal(event)"><i class="fas fa-sign-in-alt"></i> 登录</a>
                <a id="logoutBtn" href="#" style="display:none;" class="nav-btn" onclick="logout(event)"><i class="fas fa-sign-out-alt"></i> 退出</a>
                <button class="nav-btn" onclick="clearCacheAndReload()" title="清除缓存并刷新"><i class="fas fa-sync-alt"></i> 刷新</button>
            </div>
        </div>
    </header>

    <!-- ===== 移动端遮罩层 ===== -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- ===== 移动端侧边栏（由 script.js 动态渲染） ===== -->
    <div class="mobile-sidebar" id="mobileSidebar"></div>

    <!-- ===== 房间号横幅 ===== -->
    <div class="room-banner" id="roomBanner">
        <div class="room-content">
            <i class="fas fa-door-open"></i>
            <span>当前房间号：</span>
            <strong id="roomNumberDisplay">加载中...</strong>
        </div>
    </div>

    <!-- ===== 主体 ===== -->
    <div class="main-wrapper">
        <!-- 桌面端侧边栏（由 script.js 动态渲染） -->
        <aside class="desktop-sidebar" id="desktopSidebar"></aside>

        <main class="main-content" id="mainContent">
            <section id="home-content">
                <h1>欢迎来到方块狂想曲 Wiki</h1>
                <p class="subtitle">服务器制度 · 技术文档 · 玩家指南</p>
                <div class="card-grid" id="cardGrid"></div>
            </section>
            <div id="page-content" class="hidden"></div>
        </main>
    </div>

    <footer class="footer">
        <p>&copy; 2026 方块狂想曲服务器 · 由 <a href="https://github.com/BlockRhapsody" target="_blank">BlockRhapsody</a> 维护</p>
    </footer>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>🔐 登录 · 我们将会保护您的信息</h2>
            <p class="modal-sub">输入你的中国版账号名称</p>
            <div class="input-group">
                <label for="loginUsername">用户名</label>
                <input type="text" id="loginUsername" placeholder="输入中国版账号名" maxlength="32" />
            </div>
            <div class="modal-error" id="loginError">请输入用户名</div>
            <div class="modal-actions">
                <button class="btn-primary" onclick="login()">登 录</button>
                <button class="btn-secondary" onclick="closeLoginModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- ===== 加载外部文件 ===== -->
    <script src="/data.js"></script>
    <script src="/script.js"></script>

    <!-- ===== 核心脚本（页面加载、缓存、登录等，与侧边栏无关） ===== -->
    <script>
    // ============================================================
    // 版本控制与缓存管理
    // ============================================================
    var APP_VERSION = '2026.08.10.011';
    var CACHE_MAX_AGE = 5 * 60 * 1000;

    function loadVersion() {
        fetch('/version.txt?' + Date.now())
            .then(function(response) {
                if (!response.ok) throw new Error('version.txt 不存在');
                return response.text();
            })
            .then(function(text) {
                var match = text.match(/version:"([^"]+)"/);
                if (match && match[1]) {
                    APP_VERSION = match[1].trim();
                    console.log('[MCC Wiki] 版本号已加载:', APP_VERSION);
                } else {
                    console.warn('[MCC Wiki] version.txt 格式错误，使用默认版本号');
                }
                checkVersionAndClearCache();
            })
            .catch(function() {
                console.warn('[MCC Wiki] version.txt 未找到，使用默认版本号:', APP_VERSION);
                checkVersionAndClearCache();
            });
    }

    function checkVersionAndClearCache() {
        var storedVersion = localStorage.getItem('app_version');
        if (storedVersion !== APP_VERSION) {
            sessionStorage.clear();
            localStorage.setItem('app_version', APP_VERSION);
            console.log('[MCC Wiki] 版本已更新 (', storedVersion, '->', APP_VERSION, ')，缓存已清除');
        } else {
            console.log('[MCC Wiki] 版本一致，无需清除缓存');
        }
    }

    // ============================================================
    // 卡片渲染
    // ============================================================
    function getDisplayName(key) { return displayNames[key] || key; }

    function renderCards() {
        var grid = document.getElementById('cardGrid');
        var html = '';
        for (var i = 0; i < cardData.length; i++) {
            var cat = cardData[i];
            var itemsHtml = '';
            for (var j = 0; j < cat.items.length; j++) {
                var key = cat.items[j];
                itemsHtml += '<li data-page="' + key + '"><i class="fas fa-file-alt"></i> ' + getDisplayName(key) + '</li>';
            }
            html += '<div class="card"><div class="card-title"><i class="fas ' + cat.icon + '"></i> ' + cat.title + '</div><ul class="card-list">' + itemsHtml + '</ul></div>';
        }
        grid.innerHTML = html;
    }

    // ============================================================
    // 卡片点击事件
    // ============================================================
    function initCards() {
        var grid = document.getElementById('cardGrid');
        if (!grid) return;

        grid.addEventListener('click', function(e) {
            var target = e.target.closest('.card-list li');
            if (target && target.dataset.page) {
                e.preventDefault();
                e.stopPropagation();
                loadPage(target.dataset.page);
            }
        });
    }

    // ============================================================
    // 缓存检查
    // ============================================================
    function isCacheValid(cacheKey) {
        var cached = sessionStorage.getItem(cacheKey);
        var timeKey = cacheKey + '_time';
        var cacheTime = sessionStorage.getItem(timeKey);
        if (!cached || !cacheTime) return false;
        var now = Date.now();
        return (now - parseInt(cacheTime)) < CACHE_MAX_AGE;
    }

    // ============================================================
    // 重新执行动态加载的 <script> 标签
    // ============================================================
    function reExecuteScripts(container) {
        var scripts = container.querySelectorAll('script');
        scripts.forEach(function(oldScript) {
            var newScript = document.createElement('script');
            for (var i = 0; i < oldScript.attributes.length; i++) {
                var attr = oldScript.attributes[i];
                newScript.setAttribute(attr.name, attr.value);
            }
            if (oldScript.textContent) {
                newScript.textContent = oldScript.textContent;
            }
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    // ============================================================
    // 页面加载函数（带加载状态锁）
    // ============================================================
    var isLoading = false;

    function loadPage(pageId) {
        if (isLoading) {
            console.log('[MCC Wiki] 正在加载中，请稍候...');
            return;
        }

        var anchor = '';
        if (pageId.includes('#')) {
            var parts = pageId.split('#');
            pageId = parts[0];
            anchor = parts[1];
        }
        pageId = decodeURIComponent(pageId);

        var home = document.getElementById('home-content');
        var pageContent = document.getElementById('page-content');
        var path = pagePathMap[pageId];

        home.style.display = 'none';
        pageContent.innerHTML = '';
        pageContent.style.display = 'block';

        if (!path) {
            pageContent.innerHTML = '<div class="doc-content"><h1>📄 ' + pageId + '</h1><p style="color:var(--text-muted);">此页面内容正在建设中，敬请期待。</p></div>';
            if (typeof updateActiveState === 'function') {
                updateActiveState(pageId);
            }
            if (window.location.hash !== '#page-' + pageId) {
                history.pushState(null, '', '#page-' + pageId);
            }
            return;
        }

        var cacheKey = 'page_' + pageId;

        if (isCacheValid(cacheKey)) {
            var cached = sessionStorage.getItem(cacheKey);
            pageContent.innerHTML = cached;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.location.hash !== '#page-' + pageId) {
                history.pushState(null, '', '#page-' + pageId);
            }
            if (typeof updateActiveState === 'function') {
                updateActiveState(pageId);
            }
            reExecuteScripts(pageContent);

            if (pageId === '论坛') {
                setTimeout(function() { loadGiscus(); }, 300);
            }
            if (anchor) {
                setTimeout(function() {
                    var target = document.getElementById(anchor);
                    if (target) target.scrollIntoView({ behavior: 'smooth' });
                }, 150);
            }
            return;
        }

        isLoading = true;
        sessionStorage.removeItem(cacheKey);
        sessionStorage.removeItem(cacheKey + '_time');

        pageContent.innerHTML = '<div class="doc-content" style="text-align:center;padding:3rem 0;"><img src="/icon/Structure_Block_3.png" alt="加载中" class="loading-icon" style="display:block;margin:0 auto;width:64px;height:64px;image-rendering:pixelated;animation:breathe 1.2s ease-in-out infinite;" /><p style="color:var(--text-muted);margin-top:1rem;font-size:clamp(0.9rem, 1.2vw, 1.1rem);">加载中...</p></div>';

        fetch(path)
            .then(function(response) {
                if (!response.ok) {
                    if (response.status === 404) throw new Error('HTTP 404');
                    throw new Error('HTTP ' + response.status);
                }
                return response.text();
            })
            .then(function(html) {
                sessionStorage.setItem(cacheKey, html);
                sessionStorage.setItem(cacheKey + '_time', String(Date.now()));
                pageContent.innerHTML = html;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (window.location.hash !== '#page-' + pageId) {
                    history.pushState(null, '', '#page-' + pageId);
                }
                if (typeof updateActiveState === 'function') {
                    updateActiveState(pageId);
                }
                reExecuteScripts(pageContent);

                if (pageId === '论坛') {
                    setTimeout(function() { loadGiscus(); }, 300);
                }
                if (anchor) {
                    setTimeout(function() {
                        var target = document.getElementById(anchor);
                        if (target) target.scrollIntoView({ behavior: 'smooth' });
                    }, 150);
                }
            })
            .catch(function(error) {
                var message = '加载失败，请检查网络连接后重试。';
                if (error.message === 'HTTP 404') {
                    message = '📄 此页面内容正在建设中，敬请期待。';
                }
                pageContent.innerHTML = '<div class="doc-content"><h1>📄 ' + pageId + '</h1><p style="color:var(--text-muted);">' + message + '</p></div>';
            })
            .finally(function() {
                isLoading = false;
            });
    }

    // ============================================================
    // 加载 Giscus
    // ============================================================
    function loadGiscus() {
        if (document.querySelector('.giscus iframe')) {
            console.log('Giscus 已加载');
            return;
        }
        var container = document.querySelector('.giscus');
        if (!container) {
            console.warn('Giscus 容器不存在');
            return;
        }
        container.innerHTML = '';
        var script = document.createElement('script');
        script.src = 'https://giscus.app/client.js';
        script.dataset.repo = 'BlockRhapsody/blockrhapsody.github.io';
        script.dataset.repoId = 'R_kgDOTVXjKQ';
        script.dataset.category = 'General';
        script.dataset.categoryId = '51115557';
        script.dataset.mapping = 'number';
        script.dataset.term = '1';
        script.dataset.strict = '0';
        script.dataset.reactionsEnabled = '1';
        script.dataset.emitMetadata = '0';
        script.dataset.inputPosition = 'bottom';
        script.dataset.theme = 'preferred_color_scheme';
        script.dataset.lang = 'zh-CN';
        script.crossOrigin = 'anonymous';
        script.async = true;
        container.parentNode.insertBefore(script, container.nextSibling);
        console.log('Giscus 已加载');
    }

    // ============================================================
    // 清除缓存并刷新
    // ============================================================
    function clearCacheAndReload() {
        sessionStorage.clear();
        localStorage.setItem('app_version', APP_VERSION);
        location.reload();
    }
    window.clearCacheAndReload = clearCacheAndReload;

    // ============================================================
    // 返回首页
    // ============================================================
    function showHome() {
        var home = document.getElementById('home-content');
        var pageContent = document.getElementById('page-content');
        home.style.display = 'block';
        pageContent.style.display = 'none';
        pageContent.innerHTML = '';
        history.pushState(null, '', '/');
        document.querySelectorAll('.sub-menu a, .card-list li').forEach(function(el) {
            el.classList.remove('active');
        });
    }
    window.loadPage = loadPage;
    window.showHome = showHome;

    // ============================================================
    // 登录功能
    // ============================================================
    function openLoginModal(e) {
        if (e) e.preventDefault();
        document.getElementById('loginModal').classList.add('active');
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginError').classList.remove('show');
        setTimeout(function(){ document.getElementById('loginUsername').focus(); }, 100);
    }
    function closeLoginModal() {
        document.getElementById('loginModal').classList.remove('active');
    }
    function login() {
        var username = document.getElementById('loginUsername').value.trim();
        var errorEl = document.getElementById('loginError');
        if (!username) {
            errorEl.textContent = '请输入用户名';
            errorEl.classList.add('show');
            return;
        }
        if (username.length < 2) {
            errorEl.textContent = '用户名至少2个字符';
            errorEl.classList.add('show');
            return;
        }
        localStorage.setItem('token', 'mock-token');
        localStorage.setItem('username', username);
        closeLoginModal();
        updateAuthUI();
    }
    function logout(e) {
        if (e) e.preventDefault();
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        updateAuthUI();
    }
    function updateAuthUI() {
        var token = localStorage.getItem('token');
        var username = localStorage.getItem('username');
        var loginBtn = document.getElementById('loginBtn');
        var logoutBtn = document.getElementById('logoutBtn');
        var userDisplay = document.getElementById('userDisplay');
        var usernameDisplay = document.getElementById('usernameDisplay');
        if (token && username) {
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-flex';
            userDisplay.style.display = 'inline-block';
            usernameDisplay.textContent = username;
        } else {
            loginBtn.style.display = 'inline-flex';
            logoutBtn.style.display = 'none';
            userDisplay.style.display = 'none';
        }
    }

    // ============================================================
    // 房间号横幅
    // ============================================================
    function initRoomStatus() {
        var banner = document.getElementById('roomBanner');
        var display = document.getElementById('roomNumberDisplay');

        if (!banner || !display) return;

        fetch('/room_number.txt?' + Date.now())
            .then(function(response) {
                if (!response.ok) throw new Error('文件不存在');
                return response.text();
            })
            .then(function(text) {
                var match = text.match(/setroomnumber:"([^"]+)"/);
                if (match && match[1]) {
                    display.textContent = match[1];
                    banner.classList.add('show');
                } else {
                    banner.classList.remove('show');
                    console.log('[MCC Wiki] room_number.txt 格式错误，未找到有效房间号');
                }
            })
            .catch(function() {
                banner.classList.remove('show');
                console.log('[MCC Wiki] room_number.txt 未找到，房间号横幅已隐藏');
            });
    }

    // ============================================================
    // 重置滚动位置
    // ============================================================
    function resetScrollPosition() {
        window.scrollTo(0, 0);
    }

    // ============================================================
    // DOM 就绪初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        loadVersion();
        resetScrollPosition();
        document.body.classList.add('loaded');
        
        renderCards();
        initCards();
        initRoomStatus();
        updateAuthUI();

        document.getElementById('loginUsername').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });
        document.getElementById('loginModal').addEventListener('click', function(e) {
            if (e.target === this) closeLoginModal();
        });

        setTimeout(resetScrollPosition, 50);
        setTimeout(resetScrollPosition, 200);
    });

    // ============================================================
    // URL 哈希初始化
    // ============================================================
    function initHash() {
        var hash = window.location.hash;
        if (hash && hash.startsWith('#page-')) {
            var pageId = decodeURIComponent(hash.replace('#page-', ''));
            loadPage(pageId);
        }
    }
    initHash();
    </script>
</body>
